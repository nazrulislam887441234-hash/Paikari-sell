<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Registration - Step 1 | PAIKARI SELL</title>
  <link rel="icon" href="https://paikarisell.ghotimarket.com/photo/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="https://paikarisell.ghotimarket.com/photo/logo.png" alt="Logo">
      <h1>আপনার ব্যবসার যাত্রা শুরু করুন</h1>
      <p>PAIKARI SELL-এ Supplier হিসেবে যুক্ত হতে প্রথমে আপনার অ্যাকাউন্ট তৈরি করুন।</p>
    </div>

    <div id="errorAlert" class="alert-box alert-error"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">ইমেইল ঠিকানা</label>
        <input type="email" id="email" class="form-control" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" class="form-control" required placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড">
        <button type="button" id="togglePass" class="password-toggle">দেখুন</button>
      </div>

      <div class="form-group">
        <label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label>
        <input type="password" id="confirmPassword" class="form-control" required placeholder="পুনরায় পাসওয়ার্ড লিখুন">
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">অ্যাকাউন্ট তৈরি করুন</button>
    </form>

    <div class="text-link">
      আগে থেকেই অ্যাকাউন্ট আছে? <a href="/login">লগইন করুন</a>
    </div>
  </div>

  <script type="module">
    import { auth, db, showCustomError, translateFirebaseError } from './signup.js';
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');

    togglePass.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePass.innerText = type === 'password' ? 'দেখুন' : 'লুকান';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showCustomError('errorAlert', 'পাসওয়ার্ড দুটি মিলছে না।');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'অপেক্ষা করুন...';

      try {
        let user;
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          user = userCredential.user;
        } catch (err) {
          if (err.code === 'auth/email-already-in-use') {
            try {
              const loginCred = await signInWithEmailAndPassword(auth, email, password);
              user = loginCred.user;
            } catch (loginErr) {
              showCustomError('errorAlert', 'এই ইমেইলে ইতিমধ্যে অ্যাকাউন্ট রয়েছে। ভুল পাসওয়ার্ড দিয়েছেন।');
              submitBtn.disabled = false;
              submitBtn.innerText = 'অ্যাকাউন্ট তৈরি করুন';
              return;
            }
          } else {
            throw err;
          }
        }

        const docRef = doc(db, "supplyers", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          window.location.href = '/dashboard';
        } else {
          window.location.href = '/signup1';
        }

      } catch (error) {
        showCustomError('errorAlert', translateFirebaseError(error.code));
        submitBtn.disabled = false;
        submitBtn.innerText = 'অ্যাকাউন্ট তৈরি করুন';
      }
    });
  </script>
</body>
</html>
